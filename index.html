<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提车现场验车清单</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="title">提车现场验车清单</h1>
      <p class="remind">
        <span class="remind-icon" aria-hidden="true">🤝</span>
        <span class="remind-text">恭喜您提车！车辆到店时已完成 PDI 检测。现将本清单提供给您，便于现场自行参考核对。按提示勾选完成即可</span>
      </p>
    </header>

    <main class="main">
      <section class="progress" aria-labelledby="sec-progress">
        <h2 id="sec-progress" class="progress-title">验车进度</h2>
        <p class="progress-text" id="progressText">已完成 0/10 项</p>
        <div class="progress-bar" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <section class="section" aria-labelledby="sec-exterior">
        <h2 id="sec-exterior" class="section-title">外观</h2>
        <ul class="list" id="list-exterior"></ul>
      </section>

      <section class="section" aria-labelledby="sec-interior">
        <h2 id="sec-interior" class="section-title">车内与功能</h2>
        <ul class="list" id="list-interior"></ul>
      </section>

      <section class="section" aria-labelledby="sec-docs">
        <h2 id="sec-docs" class="section-title">随车文件</h2>
        <ul class="list" id="list-docs"></ul>
      </section>

      <aside class="tip" aria-label="交付说明">
        <h2 class="tip-title">交付说明</h2>
        <p class="tip-text">车辆手续已交接完毕。您按照本清单核对无误即可驶离交付中心。如发现明显异常，请联系前台或在交付群内@交付专员协助您处理，祝您用车愉快！</p>
      </aside>
    </main>

    <footer class="footer">
      <p>清单可截图保存，便于您留存核对记录</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
